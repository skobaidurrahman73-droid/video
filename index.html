<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাল্টিপুল ভিডিও ওয়াচ টাইম</title>
    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: var(--card-bg);
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-img {
            max-width: 140px;
            height: auto;
            border-radius: 8px;
        }

        .search-box {
            margin: 30px 0;
            display: flex;
            gap: 10px;
            width: 90%;
            max-width: 650px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid #334155;
            outline: none;
            font-size: 16px;
            background: #f1f5f9;
            color: #1e293b;
        }

        button.main-btn {
            padding: 14px 28px;
            border-radius: 30px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button.main-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 95%;
            padding-bottom: 100px;
        }

        .video-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .video-card h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #94a3b8;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            border: none;
        }

        /* --- Mandatory Click Ad Overlay --- */
        #adOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .ad-content {
            background: #ffffff;
            color: #1e293b;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 6px solid #ef4444;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .ad-content h2 {
            color: #dc2626;
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        .ad-content p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .visit-btn {
            display: block;
            padding: 18px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            animation: shakeBtn 0.6s infinite;
        }

        @keyframes shakeBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .note {
            display: block;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }

        /* Bottom Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            background: rgba(30, 41, 59, 0.95);
            padding: 12px 25px;
            border-radius: 40px;
            display: flex;
            gap: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid #475569;
        }

        .control-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #475569;
            background: transparent;
            color: #f8fafc;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .control-btn:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <!-- Mandatory Ad Overlay -->
    <div id="adOverlay">
        <div class="ad-content">
            <h2>অ্যাক্টিভেশন প্রয়োজন!</h2>
            <p>আপনার সার্ভার এবং হাই-স্পিড ভিডিও ওয়াচ টাইম অ্যাক্টিভেট করতে নিচের বাটনে ক্লিক করুন।</p>
            
            <a href="https://www.profitablecpmratenetwork.com/qudnwhcdb2?key=b44f9fe1af42dbc0062d8e23b73e1125" 
               target="_blank" class="visit-btn" onclick="unlockSite()">সার্ভার অ্যাক্টিভেট করুন</a>
            
            <span class="note">লিংকে ক্লিক করার পর সাইটটি আনলক হবে।</span>
        </div>
    </div>

    <header>
        <img src="1774259848280.png" alt="Logo" class="logo-img">
    </header>

    <div class="search-box">
        <input type="text" id="videoUrl" placeholder="এখানে ইউটিউব ভিডিও লিংক পেস্ট করুন...">
        <button class="main-btn" onclick="startWatching()">শুরু করুন</button>
    </div>

    <div class="grid-container" id="videoGrid">
        <!-- ভিডিওগুলো এখানে লোড হবে -->
    </div>

    <div class="controls">
        <button class="control-btn" onclick="location.reload()">রিফ্রেশ করুন</button>
        <button class="control-btn" onclick="clearVideos()">সব মুছুন</button>
    </div>

    <script>
        // ক্লিক করলে অ্যাড সরানোর ফাংশন
        function unlockSite() {
            setTimeout(function() {
                document.getElementById('adOverlay').style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 1500); 
        }

        // শুরুতে স্ক্রল বন্ধ রাখা
        document.body.style.overflow = 'hidden';

        function startWatching() {
            const urlInput = document.getElementById('videoUrl').value;
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = "";
            let videoId = "";
            
            // ইউটিউব আইডি শনাক্তকরণ
            if (urlInput.includes("v=")) {
                videoId = urlInput.split("v=")[1].split("&")[0];
            } else if (urlInput.includes("youtu.be/")) {
                videoId = urlInput.split("youtu.be/")[1].split("?")[0];
            }

            if (videoId) {
                const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}`;
                
                for (let i = 1; i <= 20; i++) {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <h4>ডিসপ্লে ${i}</h4>
                        <iframe src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    `;
                    grid.appendChild(card);
                }
            } else {
                alert("দয়া করে একটি সঠিক ইউটিউব লিংক দিন।");
            }
        }

        function clearVideos() {
            document.getElementById('videoGrid').innerHTML = "";
            document.getElementById('videoUrl').value = "";
        }
    </script>
</body>
</html>
