<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাল্টিপুল ভিডিও ওয়াচ টাইম</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 20px; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .search-container { margin-bottom: 30px; }
        input { padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding: 10px; }
        iframe { width: 100%; height: 150px; border: 2px solid #333; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="logo">লোগো (এখানে কোড বসবে)</div>

    <div class="search-container">
        <input type="text" id="videoLink" placeholder="ইউটিউব ভিডিও লিংক এখানে দিন...">
        <button onclick="loadVideos()">ভিডিও দেখান</button>
    </div>

    <div class="video-grid" id="displayArea">
        <!-- এখানে ২০টি ডিসপ্লে তৈরি হবে -->
    </div>

    <script>
        function loadVideos() {
            const link = document.getElementById('videoLink').value;
            const displayArea = document.getElementById('displayArea');
            displayArea.innerHTML = ""; // আগের ভিডিও মুছে ফেলা

            if (link.includes("watch?v=")) {
                const videoId = link.split("v=")[1].split("&")[0];
                const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`;

                for (let i = 0; i < 20; i++) {
                    const frame = `<iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe>`;
                    displayArea.innerHTML += frame;
                }
            } else {
                alert("দয়া করে সঠিক ইউটিউব লিংক দিন।");
            }
        }
    </script>

</body>
</html>
