<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাল্টিপুল ভিডিও ওয়াচ টাইম</title>
    <style>
        :root {
            --primary-bg: #1a1c23;
            --card-bg: #242731;
            --accent-color: #3d5afe;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            width: 100%; padding: 20px; text-align: center;
            background: var(--card-bg); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-img { max-width: 150px; height: auto; border-radius: 8px; }

        .search-box {
            margin: 30px 0; display: flex; gap: 10px;
            width: 90%; max-width: 700px;
        }

        input[type="text"] {
            flex: 1; padding: 15px; border-radius: 30px;
            border: none; outline: none; font-size: 16px;
        }

        button.main-btn {
            padding: 15px 30px; border-radius: 30px; border: none;
            background: var(--accent-color); color: white;
            font-weight: bold; cursor: pointer;
        }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; width: 95%; padding-bottom: 80px;
        }

        .video-card {
            background: var(--card-bg); padding: 10px;
            border-radius: 12px; text-align: center;
        }

        iframe { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; border: none; }

        /* --- Sponsored Ad Styles --- */
        #adOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .ad-content {
            background: #fff; color: #333; padding: 30px;
            border-radius: 15px; text-align: center; max-width: 400px;
            position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .ad-content h3 { color: #ff3d00; margin-top: 0; }

        .visit-btn {
            display: inline-block; padding: 12px 25px; margin-top: 15px;
            background: #28a745; color: white; text-decoration: none;
            border-radius: 5px; font-weight: bold;
        }

        .close-ad {
            position: absolute; top: 10px; right: 10px;
            cursor: pointer; font-size: 20px; color: #999;
        }

        .controls {
            position: fixed; bottom: 20px; background: rgba(36, 39, 49, 0.9);
            padding: 10px 20px; border-radius: 50px; display: flex; gap: 15px;
        }

        .control-btn {
            padding: 8px 15px; border-radius: 20px; border: 1px solid #555;
            background: transparent; color: white; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sponsored Ad Modal -->
    <div id="adOverlay">
        <div class="ad-content">
            <span class="close-ad" onclick="closeAd()">&times;</span>
            <h3>স্পন্সরড অফার!</h3>
            <p>আমাদের সাইটটি ফ্রি রাখতে সাহায্য করুন। নিচের লিংকে ক্লিক করে আমাদের স্পন্সর ভিজিট করুন।</p>
            <a href="https://www.profitablecpmratenetwork.com/qudnwhcdb2?key=b44f9fe1af42dbc0062d8e23b73e1125" target="_blank" class="visit-btn" onclick="closeAd()">লিংক ভিজিট করুন</a>
        </div>
    </div>

    <header>
        <img src="1774259848280.png" alt="লোগো" class="logo-img">
    </header>

    <div class="search-box">
        <input type="text" id="videoUrl" placeholder="এখানে ইউটিউব ভিডিও লিংক পেস্ট করুন...">
        <button class="main-btn" onclick="startWatching()">ভিডিও দেখান</button>
    </div>

    <div class="grid-container" id="videoGrid"></div>

    <div class="controls">
        <button class="control-btn" onclick="location.reload()">সব রিফ্রেশ</button>
        <button class="control-btn" onclick="clearVideos()">সব বন্ধ</button>
    </div>

    <script>
        // ৫ সেকেন্ড পর বিজ্ঞাপন দেখাবে
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('adOverlay').style.display = 'flex';
            }, 5000); 
        };

        function closeAd() {
            document.getElementById('adOverlay').style.display = 'none';
        }

        function startWatching() {
            const urlInput = document.getElementById('videoUrl').value;
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = "";
            let videoId = "";
            
            if (urlInput.includes("v=")) {
                videoId = urlInput.split("v=")[1].split("&")[0];
            } else if (urlInput.includes("youtu.be/")) {
                videoId = urlInput.split("youtu.be/")[1].split("?")[0];
            }

            if (videoId) {
                const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}`;
                for (let i = 1; i <= 20; i++) {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `<h4>ডিসপ্লে ${i}</h4><iframe src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                    grid.appendChild(card);
                }
            } else {
                alert("সঠিক লিংক দিন।");
            }
        }

        function clearVideos() {
            document.getElementById('videoGrid').innerHTML = "";
        }
    </script>
</body>
</html>
